<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handover at 18 · Prototype</title>
    <meta name="description" content="A prototype by Manasa Rammohan of a child's pension depot, from age 6 to the day it becomes theirs. Made-up data." />
    <meta name="theme-color" content="#f2f4f8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400&family=Overpass:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29V17' stroke='%236b5a45' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='9' fill='%233d7a5e'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="page">
      <p class="crumb"><a href="../vantage/">Vantage</a> · Chapter 2 · Between generations</p>
      <header class="page-head">
        <h1>Handover at 18</h1>
        <p>A prototype of a child’s pension depot, from age 6 to the day it becomes theirs. Made-up data.</p>
      </header>

      <div class="proto" aria-label="Prototype controls">
        <div class="proto-group" role="group" aria-label="Who's looking">
          <span class="proto-label">Who’s looking:</span>
          <button type="button" data-who="parent" aria-pressed="false">Parent</button>
          <span class="proto-sep" aria-hidden="true">/</span>
          <button type="button" data-who="nina" aria-pressed="true">Nina</button>
        </div>
        <label class="proto-group age-control">
          <span class="proto-label">Nina’s age:</span>
          <span class="age-end" aria-hidden="true">6</span>
          <input type="range" id="age" min="6" max="18" step="1" value="7" aria-valuetext="7 years old" />
          <span class="age-end" aria-hidden="true">18</span>
          <output id="age-out" for="age">7</output>
        </label>
      </div>

      <main class="stage">
        <div class="phone">
          <div class="screen" id="screen" aria-live="polite"></div>
        </div>
      </main>

      <footer class="page-foot">
        <a href="./spec.html">Read the product spec</a>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
